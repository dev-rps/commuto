version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: commuto_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: commuto_user
      POSTGRES_PASSWORD: commuto_pass
      POSTGRES_DB: commuto_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
